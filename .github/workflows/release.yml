name: Release

# NOTA sobre el canal de releases:
# El autoupdate del desktop apunta al repo PÚBLICO `equazin/asimov-releases`
# (ver electron-builder.yml → publish). El código fuente vive en el repo privado.
#
# Este workflow NO publica la release (el GITHUB_TOKEN por defecto sólo puede
# escribir en ESTE repo, no en asimov-releases). Sólo compila y empaqueta el
# instalador como artefacto, para validar que el build pasa en cada tag.
#
# La publicación oficial se hace con `npm run release` en local (electron-builder
# sube a asimov-releases). Para publicar desde CI en su lugar, agregá un secret
# `RELEASES_TOKEN` (PAT con contents:write en asimov-releases) y descomentá el
# paso "Publish" de más abajo apuntando a ese repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    # windows-2022 trae VS 2022 Build Tools pre-instalado (necesario para
    # compilar better-sqlite3 desde fuente por `buildDependenciesFromSource`
    # en electron-builder.yml). El default `windows-latest` migró a
    # Windows Server 2025 sin VS, y node-gyp falla al no encontrarlo.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-gyp necesita Python en el PATH para invocar sus scripts de build.
      # 3.11 y no 3.12+: node-gyp usa `distutils`, removido de la stdlib en 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Asegura MSBuild en el PATH (a veces node-gyp no lo detecta solo).
      - uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package installer (sin publicar)
        run: npx electron-builder --win --publish never
        env:
          # Code signing (uncomment when certificate is ready):
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.yml
          retention-days: 30

      # --- Publicación a asimov-releases (DESACTIVADA por defecto) ---
      # Requiere el secret RELEASES_TOKEN (PAT con contents:write en asimov-releases).
