<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Selección de Proveedores</title>
  <style>
    :root {
      --bg: #14171D;
      --surface: #1b1f27;
      --card: #232833;
      --accent: #FF6A2B;
      --accent-hover: #e85e25;
      --border: #343a43;
      --border-soft: #2c333d;
      --text: #f2f3f5;
      --text-muted: #9aa1ab;
      --input-bg: #171b22;
      --select-bg: rgba(255,106,43,0.15);
      --select-border: rgba(255,106,43,0.5);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: 32px;
      user-select: none;
    }

    .search-panel {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }
    .search-label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .search-input {
      height: 32px;
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,106,43,0.18);
    }
    .search-input::placeholder { color: #6f7784; }

    .btn {
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s;
      outline: none;
    }
    .btn:hover { background: #2a303b; }
    .btn:active { background: #1e2430; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--input-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      position: sticky;
      top: 0;
      background: var(--card);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border-soft);
      z-index: 10;
      white-space: nowrap;
    }
    th:last-child { border-right: none; }
    td {
      padding: 5px 8px;
      font-size: 11px;
      border-bottom: 1px solid var(--border-soft);
      border-right: 1px solid rgba(52,58,67,0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    td:last-child { border-right: none; }

    tbody tr { cursor: pointer; background: var(--input-bg); }
    tbody tr:nth-child(even) { background: #1c2129; }
    tbody tr:hover { background: var(--card); }
    tbody tr.selected {
      background: var(--select-bg) !important;
      outline: 1px solid var(--select-border);
      outline-offset: -1px;
    }
    tbody tr.selected td { color: #fff; }

    .col-code { width: 80px; font-family: "Cascadia Code", Consolas, monospace; color: var(--accent); }
    .col-name { min-width: 260px; }
    .col-address { width: 220px; color: var(--text-muted); }
    .col-phone { width: 140px; }
    .col-cuit { width: 120px; font-family: "Cascadia Code", Consolas, monospace; }

    .empty-msg { text-align: center; padding: 26px; color: var(--text-muted); font-style: italic; }

    .bottom-panel {
      padding: 10px 16px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-bar { display: flex; align-items: center; gap: 12px; }
    .record-count {
      margin-left: auto;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
    }
    .actions-bar { display: flex; gap: 8px; align-items: center; }
    .actions-bar .btn { flex: 1; height: 34px; font-size: 12px; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #343a43; border-radius: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
  </style>
</head>
<body>

  <div class="search-panel">
    <span class="search-label">Razón Social</span>
    <input type="text" class="search-input" id="txtSearch" placeholder="Escriba aquí para buscar por razón social, CUIT o código..." autofocus />
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-code">Código</th>
          <th class="col-name">Razón Social</th>
          <th class="col-address">Domicilio</th>
          <th class="col-phone">Teléfono</th>
          <th class="col-cuit">CUIT</th>
        </tr>
      </thead>
      <tbody id="supplierTableBody">
        <tr><td colspan="5" class="empty-msg">Cargando proveedores...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="bottom-panel">
    <div class="info-bar">
      <span class="record-count" id="lblRecordCount">0 / 0</span>
    </div>
    <div class="actions-bar">
      <button class="btn btn-primary" id="btnSelect">Seleccionar</button>
      <button class="btn" id="btnNew">Nuevo</button>
      <button class="btn" id="btnModify" disabled>Modificar</button>
      <button class="btn" id="btnExit">Salir</button>
    </div>
  </div>

  <script>
    let suppliers = [];
    let filteredSuppliers = [];
    let selectedIndex = 0;
    let contextId = "";

    const txtSearch = document.getElementById("txtSearch");
    const tableBody = document.getElementById("supplierTableBody");
    const lblRecordCount = document.getElementById("lblRecordCount");
    const btnSelect = document.getElementById("btnSelect");
    const btnNew = document.getElementById("btnNew");
    const btnExit = document.getElementById("btnExit");

    if (window.asimovSupplierSelection) {
      window.asimovSupplierSelection.onInit((data) => {
        contextId = (data && data.contextId) || "";
      });
      window.asimovSupplierSelection.onSuppliersLoaded((loaded) => {
        suppliers = loaded || [];
        filterAndRender();
      });
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str == null ? "" : String(str);
      return d.innerHTML;
    }

    function renderTable() {
      tableBody.innerHTML = "";
      if (filteredSuppliers.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="5" class="empty-msg">No se encontraron proveedores.</td>';
        tableBody.appendChild(tr);
        lblRecordCount.textContent = "0 / 0";
        return;
      }

      filteredSuppliers.forEach((sup, index) => {
        const tr = document.createElement("tr");
        if (index === selectedIndex) tr.className = "selected";
        tr.innerHTML =
          '<td class="col-code">' + escapeHtml(sup.codigo || sup.id || "") + '</td>' +
          '<td class="col-name">' + escapeHtml(sup.razonSocial || sup.name || "") + '</td>' +
          '<td class="col-address">' + escapeHtml(sup.domicilio || sup.address || "") + '</td>' +
          '<td class="col-phone">' + escapeHtml(sup.telefono || sup.phone || "") + '</td>' +
          '<td class="col-cuit">' + escapeHtml(sup.cuit || "") + '</td>';
        tr.addEventListener("click", () => selectIndex(index));
        tr.addEventListener("dblclick", () => submitSelection());
        tableBody.appendChild(tr);
      });

      lblRecordCount.textContent = (selectedIndex + 1) + " / " + filteredSuppliers.length;
      const selectedRow = tableBody.querySelector(".selected");
      if (selectedRow) selectedRow.scrollIntoView({ block: "nearest" });
    }

    function selectIndex(index) {
      if (index >= 0 && index < filteredSuppliers.length) {
        selectedIndex = index;
        renderTable();
      }
    }

    function filterAndRender() {
      const term = txtSearch.value.toUpperCase();
      filteredSuppliers = suppliers.filter(function (sup) {
        const name = (sup.razonSocial || sup.name || "").toUpperCase();
        const code = String(sup.codigo || sup.id || "").toUpperCase();
        const addr = (sup.domicilio || sup.address || "").toUpperCase();
        const phone = (sup.telefono || sup.phone || "").toUpperCase();
        const cuit = (sup.cuit || "").toUpperCase();
        return name.includes(term) || code.includes(term) || addr.includes(term) || phone.includes(term) || cuit.includes(term);
      });
      selectedIndex = 0;
      renderTable();
    }

    function submitSelection() {
      const selected = filteredSuppliers[selectedIndex];
      if (selected && window.asimovSupplierSelection) {
        window.asimovSupplierSelection.selectSupplier(selected, contextId);
      }
    }

    txtSearch.addEventListener("input", filterAndRender);

    window.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown") { e.preventDefault(); selectIndex(selectedIndex + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); selectIndex(selectedIndex - 1); }
      else if (e.key === "Enter") { e.preventDefault(); submitSelection(); }
      else if (e.key === "Escape") {
        e.preventDefault();
        if (window.asimovSupplierSelection) window.asimovSupplierSelection.selectSupplier(null, contextId);
      }
    });

    btnSelect.addEventListener("click", submitSelection);
    btnNew.addEventListener("click", function () {
      if (window.asimovSupplierSelection) window.asimovSupplierSelection.openNewSupplier();
    });
    const closeHandler = function () {
      if (window.asimovSupplierSelection) window.asimovSupplierSelection.selectSupplier(null, contextId);
    };
    btnExit.addEventListener("click", closeHandler);

    filterAndRender();
  </script>
</body>
</html>
