<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';" />
  <title>Selección de Clientes</title>
  <style>
    :root {
      --bg: #14171D;
      --surface: #1b1f27;
      --card: #232833;
      --accent: #FF6A2B;
      --accent-hover: #e85e25;
      --border: #343a43;
      --border-soft: #2c333d;
      --text: #f2f3f5;
      --text-muted: #9aa1ab;
      --input-bg: #171b22;
      --select-bg: rgba(255,106,43,0.15);
      --select-border: rgba(255,106,43,0.5);
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: 32px;
      user-select: none;
    }

    .search-panel {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }
    .search-label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .search-input {
      height: 32px;
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,106,43,0.18);
    }
    .search-input::placeholder { color: #6f7784; }

    .btn {
      height: 32px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s;
      outline: none;
    }
    .btn:hover { background: #2a303b; }
    .btn:active { background: #1e2430; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--input-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      position: sticky;
      top: 0;
      background: var(--card);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border-soft);
      z-index: 10;
      white-space: nowrap;
    }
    th:last-child { border-right: none; }
    td {
      padding: 5px 8px;
      font-size: 11px;
      border-bottom: 1px solid var(--border-soft);
      border-right: 1px solid rgba(52,58,67,0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    td:last-child { border-right: none; }

    tbody tr { cursor: pointer; background: var(--input-bg); }
    tbody tr:nth-child(even) { background: #1c2129; }
    tbody tr:hover { background: var(--card); }
    tbody tr.selected {
      background: var(--select-bg) !important;
      outline: 1px solid var(--select-border);
      outline-offset: -1px;
    }
    tbody tr.selected td { color: #fff; }

    .col-code { width: 80px; font-family: "Cascadia Code", Consolas, monospace; color: var(--accent); }
    .col-name { min-width: 260px; }
    .col-address { width: 220px; color: var(--text-muted); }
    .col-phone { width: 140px; }
    .col-cuit { width: 120px; font-family: "Cascadia Code", Consolas, monospace; }

    .empty-msg { text-align: center; padding: 26px; color: var(--text-muted); font-style: italic; }

    .bottom-panel {
      padding: 10px 16px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .info-bar { display: flex; align-items: center; gap: 12px; }
    .record-count {
      margin-left: auto;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-muted);
    }
    .actions-bar { display: flex; gap: 8px; align-items: center; }
    .actions-bar .btn { flex: 1; height: 34px; font-size: 12px; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #343a43; border-radius: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
  </style>
</head>
<body>

  <div class="search-panel">
    <span class="search-label">Razón Social</span>
    <input type="text" class="search-input" id="txtSearch" placeholder="Escriba aquí para buscar por razón social, CUIT o código..." autofocus />
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="col-code">Código</th>
          <th class="col-name">Razón Social</th>
          <th class="col-address">Domicilio</th>
          <th class="col-phone">Teléfono</th>
          <th class="col-cuit">CUIT</th>
        </tr>
      </thead>
      <tbody id="clientTableBody">
        <tr><td colspan="5" class="empty-msg">Cargando clientes...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="bottom-panel">
    <div class="info-bar">
      <span class="record-count" id="lblRecordCount">0 / 0</span>
    </div>
    <div class="actions-bar">
      <button class="btn btn-primary" id="btnSelect">Seleccionar</button>
      <button class="btn" id="btnNew">Nuevo</button>
      <button class="btn" id="btnModify" disabled>Modificar</button>
      <button class="btn" id="btnExit">Salir</button>
    </div>
  </div>

  <script src="client-selection.js"></script>
</body>
</html>
