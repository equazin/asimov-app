<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Asimov — Ingreso</title>
  <style>
    :root {
      --bg: #14171D;
      --surface: #1b1f27;
      --card: #232833;
      --accent: #FF6A2B;
      --accent-hover: #e85e25;
      --border: #343a43;
      --text: #f2f3f5;
      --text-muted: #9aa1ab;
      --input-bg: #171b22;
      --success: #22c55e;
      --danger: #e5544b;
      --radius: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 32px;
      user-select: none;
    }
    .card {
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 24px 22px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .brand { text-align: center; margin-bottom: 18px; }
    .brand .dot {
      display: inline-block;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 22px; font-weight: 800;
      line-height: 44px;
    }
    .brand h1 { font-size: 18px; margin-top: 10px; font-weight: 700; }
    .brand p { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

    .tabs { display: flex; gap: 4px; padding: 3px; background: var(--input-bg); border-radius: 999px; margin-bottom: 18px; }
    .tab {
      flex: 1; height: 30px; font: inherit; font-size: 12px; font-weight: 700;
      color: var(--text-muted); background: transparent; border: none; border-radius: 999px;
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:not(.active):hover { color: var(--text); }

    .pane { display: none; }
    .pane.active { display: block; }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      height: 38px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,106,43,0.18); }

    button.primary {
      width: 100%;
      height: 40px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
      margin-top: 4px;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.5; cursor: default; }

    .error { color: var(--danger); font-size: 12px; min-height: 16px; margin-bottom: 8px; text-align: center; }
    .hint { color: var(--text-muted); font-size: 10.5px; text-align: center; margin-top: 12px; line-height: 1.55; }
    .hint a { color: var(--accent); text-decoration: none; cursor: pointer; }
    .status-row { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10.5px; color: var(--text-muted); margin-bottom: 8px; }
    .dotstat { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); display: inline-block; }
    .dotstat.ok { background: var(--success); }
    .dotstat.err { background: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="dot">A</span>
      <h1>Asimov</h1>
      <p>Ingreso al sistema</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="cloud" type="button" role="tab" aria-selected="true">🌐 Nube</button>
      <button class="tab" data-tab="local" type="button" role="tab" aria-selected="false">💻 Local</button>
    </div>

    <div class="error" id="error"></div>

    <!-- ═══ NUBE ═══ -->
    <form class="pane active" id="cloudPane" autocomplete="off">
      <div class="status-row"><span class="dotstat" id="cloudDot"></span><span id="cloudStatusText">Comprobando servidor…</span></div>
      <label for="cloudEmail">Email</label>
      <input type="email" id="cloudEmail" autocomplete="username" autofocus />
      <label for="cloudPass">Contraseña</label>
      <input type="password" id="cloudPass" autocomplete="current-password" />
      <button type="submit" class="primary" id="btnCloudLogin">Ingresar</button>
      <div class="hint">Ingresá con el email de la empresa creada en el panel maestro. Todas las PC de tu empresa se sincronizan a través de la nube.</div>
    </form>

    <!-- ═══ LOCAL ═══ -->
    <form class="pane" id="localPane" autocomplete="off">
      <label for="localUser">Usuario o email</label>
      <input type="text" id="localUser" autocomplete="username" />
      <label for="localPass">Contraseña</label>
      <input type="password" id="localPass" autocomplete="current-password" />
      <button type="submit" class="primary" id="btnLocalLogin">Ingresar en modo local</button>
      <div class="hint">Sin conexión a la nube. Los datos quedan sólo en esta PC.</div>
    </form>
  </div>

  <script>
    const errorEl = document.getElementById("error");
    const cloudPane = document.getElementById("cloudPane");
    const localPane = document.getElementById("localPane");
    const cloudDot = document.getElementById("cloudDot");
    const cloudStatusText = document.getElementById("cloudStatusText");

    // --- Tabs ---
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        errorEl.textContent = "";
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        btn.setAttribute("aria-selected", "true");
        const paneId = btn.dataset.tab === "cloud" ? "cloudPane" : "localPane";
        document.getElementById(paneId).classList.add("active");
        const focusId = btn.dataset.tab === "cloud" ? "cloudEmail" : "localUser";
        setTimeout(() => document.getElementById(focusId).focus(), 60);
      });
    });

    // --- Estado del servidor cloud ---
    async function refreshCloudStatus() {
      try {
        const res = await window.asimovLogin.cloudTest();
        if (res && res.reachable) {
          cloudDot.className = "dotstat ok";
          cloudStatusText.textContent = "Servidor disponible";
        } else {
          cloudDot.className = "dotstat err";
          cloudStatusText.textContent = "Servidor no responde";
        }
      } catch {
        cloudDot.className = "dotstat err";
        cloudStatusText.textContent = "Sin conexión";
      }
    }
    refreshCloudStatus();

    // --- Cloud login ---
    cloudPane.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const email = document.getElementById("cloudEmail").value.trim();
      const pass = document.getElementById("cloudPass").value;
      if (!email || !pass) { errorEl.textContent = "Ingresá email y contraseña."; return; }
      const btn = document.getElementById("btnCloudLogin");
      btn.disabled = true;
      btn.textContent = "Ingresando…";
      try {
        const res = await window.asimovLogin.cloudLogin(email, pass);
        if (!res || !res.ok) {
          errorEl.textContent = (res && res.error) || "No se pudo iniciar sesión en la nube.";
          btn.disabled = false;
          btn.textContent = "Ingresar";
          document.getElementById("cloudPass").value = "";
          document.getElementById("cloudPass").focus();
          return;
        }
        // Sesión cloud OK: pedimos al main que abra el shell.
        const done = await window.asimovLogin.cloudCompleteLogin();
        if (!done || !done.ok) {
          errorEl.textContent = "Sesión iniciada pero no se pudo abrir el sistema.";
          btn.disabled = false;
          btn.textContent = "Ingresar";
        }
      } catch (err) {
        errorEl.textContent = "Error de conexión con el servidor.";
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    });

    // --- Local login (compatibilidad) ---
    localPane.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const user = document.getElementById("localUser").value.trim();
      const pass = document.getElementById("localPass").value;
      if (!user || !pass) { errorEl.textContent = "Ingresá usuario y contraseña."; return; }
      const btn = document.getElementById("btnLocalLogin");
      btn.disabled = true;
      btn.textContent = "Ingresando…";
      try {
        const res = await window.asimovLogin.login(user, pass);
        if (!res || !res.ok) {
          errorEl.textContent = (res && res.error) || "No se pudo iniciar sesión.";
          btn.disabled = false;
          btn.textContent = "Ingresar en modo local";
          document.getElementById("localPass").value = "";
          document.getElementById("localPass").focus();
        }
      } catch (err) {
        errorEl.textContent = "Error de conexión con la base local.";
        btn.disabled = false;
        btn.textContent = "Ingresar en modo local";
      }
    });
  </script>
</body>
</html>
