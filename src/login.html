<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self';" />
  <title>Asimov — Ingreso</title>
  <style>
    :root {
      --bg: #14171D;
      --surface: #1b1f27;
      --card: #232833;
      --accent: #FF6A2B;
      --accent-hover: #e85e25;
      --border: #343a43;
      --text: #f2f3f5;
      --text-muted: #9aa1ab;
      --input-bg: #171b22;
      --danger: #e5544b;
      --radius: 9px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 32px;
      user-select: none;
    }
    .card {
      width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .brand {
      text-align: center;
      margin-bottom: 22px;
    }
    .brand .dot {
      display: inline-block;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 22px; font-weight: 800;
      line-height: 44px;
    }
    .brand h1 { font-size: 18px; margin-top: 10px; font-weight: 700; }
    .brand p { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

    label {
      display: block;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      height: 38px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,106,43,0.18); }

    button {
      width: 100%;
      height: 40px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }

    .error {
      color: var(--danger);
      font-size: 12px;
      min-height: 16px;
      margin-bottom: 10px;
      text-align: center;
    }
    .hint {
      color: var(--text-muted);
      font-size: 10px;
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }
    code { color: var(--accent); font-family: Consolas, monospace; }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="brand">
      <span class="dot">A</span>
      <h1>Asimov</h1>
      <p>Ingreso al sistema</p>
    </div>
    <div class="error" id="error"></div>
    <label for="user">Usuario o email</label>
    <input type="text" id="user" autocomplete="username" autofocus />
    <label for="pass">Contraseña</label>
    <input type="password" id="pass" autocomplete="current-password" />
    <button type="submit" id="btnLogin">Ingresar</button>
    <div class="hint" id="hint"></div>
  </form>

  <script src="login.js"></script>
</body>
</html>
