appId: ar.com.bartez.asimov
productName: Asimov
copyright: © Bartez Tecnología

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

protocols:
  - name: Asimov
    schemes:
      - bartez

# --- Windows: instalador NSIS (.exe) ---
win:
  target:
    - nsis
  artifactName: asimov-erp-by-bartez-Setup-${version}.${ext}
  icon: build/icon.ico
  # Firma de código: requiere certificado EV/OV.
  # Descomentar cuando se tenga certificado:
  # signingHashAlgorithms:
  #   - sha256
  # certificateSubjectName: "Bartez Tecnología SRL"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Asimov
  menuCategory: true
  deleteAppDataOnUninstall: false

# --- Auto-update vía GitHub Releases ---
# Feed en el repo PÚBLICO `asimov-releases`: las PCs leen `latest.yml` sin token y
# sin exponer el código (que vive en el repo privado `asimov-app`).
# Migración: la build 4.6.2 ya se publicó también en `asimov-app` para que la flota
# actual (que aún chequea ahí) reciba esta versión y pase a apuntar a este feed.
publish:
  - provider: github
    owner: equazin
    repo: asimov-releases
    releaseType: release
