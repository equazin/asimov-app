appId: ar.com.bartez.asimov
productName: Asimov
copyright: © Bartez Tecnología

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

protocols:
  - name: Asimov
    schemes:
      - bartez

# --- Windows: instalador NSIS (.exe) ---
win:
  target:
    - nsis
  artifactName: asimov-erp-by-bartez-Setup-${version}.${ext}
  icon: build/icon.ico
  # Firma de código: requiere certificado EV/OV.
  # Descomentar cuando se tenga certificado:
  # signingHashAlgorithms:
  #   - sha256
  # certificateSubjectName: "Bartez Tecnología SRL"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Asimov
  menuCategory: true
  deleteAppDataOnUninstall: false

# --- Auto-update vía GitHub Releases ---
# El PRIMER provider define a dónde apunta el autoupdate embebido (app-update.yml):
# el repo PÚBLICO `asimov-releases`, para que las PCs lean el feed sin token y sin
# exponer el código (que vive en el repo privado `asimov-app`).
# El segundo (`asimov-app`) se mantiene sólo durante la migración, para que la flota
# actual —que todavía chequea `asimov-app`— reciba esta build y pase al nuevo canal.
# Una vez migrada, se elimina y `asimov-app` vuelve a privado.
publish:
  - provider: github
    owner: equazin
    repo: asimov-releases
    releaseType: release
  - provider: github
    owner: equazin
    repo: asimov-app
    releaseType: release
