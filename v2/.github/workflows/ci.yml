name: CI

on:
  push:
    branches: [main, develop]
    paths: ['v2/**']
  pull_request:
    branches: [main]
    paths: ['v2/**']

defaults:
  run:
    working-directory: v2

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asimov
          POSTGRES_PASSWORD: asimov_test
          POSTGRES_DB: asimov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asimov"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm turbo db:generate

      - name: Run migrations
        run: cd packages/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://asimov:asimov_test@localhost:5432/asimov_test

      - name: Run API tests
        run: pnpm turbo test --filter=@asimov/api
        env:
          DATABASE_URL: postgresql://asimov:asimov_test@localhost:5432/asimov_test
          JWT_SECRET: test-secret-key-for-ci
          NODE_ENV: test

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@asimov/admin
        env:
          NEXT_PUBLIC_API_URL: https://api.asimov.com/api/v1
