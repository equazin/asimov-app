name: Deploy

on:
  push:
    branches: [main]
    paths: ['v2/**']

defaults:
  run:
    working-directory: v2

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy-api]') || contains(github.event.head_commit.message, '[deploy-all]')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@asimov/api

      # Deploy to Railway/Fly.io (configure secrets in repo settings)
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy-admin]') || contains(github.event.head_commit.message, '[deploy-all]')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@asimov/admin
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      # Deploy to Vercel
      # - uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: v2/packages/admin

  deploy-mobile:
    name: Build Mobile (EAS)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[deploy-mobile]') || contains(github.event.head_commit.message, '[deploy-all]')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # - run: cd packages/mobile && eas build --platform all --non-interactive
